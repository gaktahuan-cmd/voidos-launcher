<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>voidOS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; color: #fff;
    font-family: sans-serif;
    overflow: hidden;
  }
  .home {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #clock { font-size: 72px; font-weight: 200; }
  #date { margin-top: 8px; font-size: 16px; opacity: .6; }
  .brand { position: absolute; bottom: 40px; font-size: 14px; opacity: .4; letter-spacing: 4px; }
</style>
</head>
<body>
  <div class="home">
    <div id="clock">00.00</div>
    <div id="date"></div>
    <div class="brand">VOID OS</div>
  </div>

<script>
  function tick() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = h + '.' + m;
    document.getElementById('date').textContent =
      d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
